# Regenerates the contribution snake and the LeetCode card for README.md
# and publishes them to the `output` branch, which the README links to.
name: profile assets

on:
  schedule:
    - cron: "0 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # served from this repo because the card service is too slow for GitHub's image proxy;
      # animation=false: the animated card starts invisible and can stay blank inside <img>.
      # Runs first so dist/ is owned by the runner user: snk runs in a root container,
      # and a root-owned dist/ makes later writes fail (curl exit 23).
      - name: Fetch LeetCode card
        run: |
          mkdir -p dist
          for theme in light dark; do
            curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 60 \
              "https://leetcard.jacoblin.cool/KhachaturPepanian?theme=${theme}&ext=heatmap&animation=false" \
              -o "dist/leetcode-${theme}.svg"
          done

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
